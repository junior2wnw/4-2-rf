name: four-two-dev

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fourtwo}
      POSTGRES_USER: ${POSTGRES_USER:-fourtwo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fourtwo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fourtwo} -d ${POSTGRES_DB:-fourtwo}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  memory-sidecar:
    build:
      context: ..
      dockerfile: deploy/docker/memory-sidecar/Dockerfile
    environment:
      MEMORY_PALACE_PATH: /data/palace
      MEMORY_BOOTSTRAP_TEXT: ${MEMORY_BOOTSTRAP_TEXT:-4-2.рф memory bootstrap}
      MEMORY_SIDECAR_API_KEY: ${MEMORY_SIDECAR_API_KEY}
    volumes:
      - memory_data:/data/palace
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz').status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  agent-builder:
    build:
      context: ..
      dockerfile: deploy/docker/agent-builder/Dockerfile
    environment:
      VERSION: ${AGENT_VERSION:-0.1.0}
      API_URL: ${API_PUBLIC_BASE_URL:-https://4-2.рф/api}
      INSTALLER_BASE_URL: ${INSTALLER_BASE_URL:-https://4-2.рф/api/v1/installers}
    volumes:
      - agent_artifacts:/workspace/apps/agent/dist
    profiles: ["build"]

  api:
    build:
      context: ..
      dockerfile: deploy/docker/api/Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-https://4-2.рф/api}
      WEB_PUBLIC_BASE_URL: ${WEB_PUBLIC_BASE_URL:-https://4-2.рф}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-1200}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-60000}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-fourtwo}:${POSTGRES_PASSWORD:-fourtwo}@postgres:5432/${POSTGRES_DB:-fourtwo}}
      MEMORY_SIDECAR_URL: http://memory-sidecar:8090
      MEMORY_SIDECAR_API_KEY: ${MEMORY_SIDECAR_API_KEY}
      AGENT_ENROLLMENT_SECRET: ${AGENT_ENROLLMENT_SECRET}
      AGENT_ARTIFACTS_DIR: /artifacts
      INSTALLER_BASE_URL: ${INSTALLER_BASE_URL:-https://4-2.рф/api/v1/installers}
      KNOWLEDGE_ADMIN_API_KEY: ${KNOWLEDGE_ADMIN_API_KEY}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    volumes:
      - agent_artifacts:/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      memory-sidecar:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://4-2.рф}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://4-2.рф}
      INTERNAL_API_BASE_URL: http://api:8080
      KNOWLEDGE_ADMIN_API_KEY: ${KNOWLEDGE_ADMIN_API_KEY}
      OPS_BASIC_AUTH_USERNAME: ${OPS_BASIC_AUTH_USERNAME}
      OPS_BASIC_AUTH_PASSWORD: ${OPS_BASIC_AUTH_PASSWORD}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "${SITE_HTTP_PORT:-80}:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  memory_data:
  agent_artifacts:
  caddy_data:
  caddy_config:
