name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @4-2/contracts build
      - run: pnpm --filter @4-2/api test
      - run: pnpm --filter @4-2/api typecheck
      - run: pnpm --filter web typecheck
      - run: pnpm --filter @4-2/api build
      - run: pnpm --filter web build

  memory-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install fastapi httpx pytest
      - run: python -m pytest apps/memory-sidecar/test -q

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: cd apps/agent && go test ./...
      - run: bash scripts/build-agent.sh
